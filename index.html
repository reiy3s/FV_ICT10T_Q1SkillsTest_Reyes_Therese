<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />

<style>

    body{

    #h1{

    <h1 id="h1">KNØT's Goodie List</h1>

        <button type="button" py-click="create_order">Create Order</button>

        <div id="receipt"></div>
    
    </form>
    </div>

    <div id="output2"></div>
